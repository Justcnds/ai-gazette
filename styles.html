<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20 种前端设计风格全景展示馆 // DESIGN SYSTEM MUSEUM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 基础重置 */
    * { box-sizing: border-box; }
    
    /* 动效与纹理辅助 */
    .transition-stage {
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* CRT 扫描线纹理 */
    .crt-scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
      background-size: 100% 3px, 4px 100%;
    }

    /* 蓝图网格纹理 */
    .blueprint-grid {
      background-image: linear-gradient(to right, rgba(100, 255, 218, 0.15) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(100, 255, 218, 0.15) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Win95 凹凸立体边框 */
    .win95-outset {
      border: 2px solid;
      border-color: #FFFFFF #808080 #808080 #FFFFFF;
    }
    .win95-inset {
      border: 2px solid;
      border-color: #808080 #FFFFFF #FFFFFF #808080;
    }

    /* 粘土拟态阴影 */
    .clay-card {
      box-shadow: 12px 16px 28px rgba(130, 160, 210, 0.35),
                  inset 4px 4px 8px rgba(255, 255, 255, 0.85),
                  inset -4px -4px 8px rgba(130, 160, 210, 0.25);
    }

    /* 新拟物化 Soft-UI 阴影 */
    .neumorphic-box {
      background: #E0E5EC;
      box-shadow: 8px 8px 16px #B8B9BE, -8px -8px 16px #FFFFFF;
    }
    .neumorphic-inset {
      background: #E0E5EC;
      box-shadow: inset 4px 4px 8px #B8B9BE, inset -4px -4px 8px #FFFFFF;
    }

    /* 极光毛玻璃背景 */
    .aurora-bg {
      background: linear-gradient(135deg, #1A1C29 0%, #162447 50%, #1F4068 100%);
    }

    /* 孟菲斯波普斑纹 */
    .memphis-pattern {
      background-color: #FFF9E6;
      background-image: radial-gradient(#111111 1.5px, transparent 1.5px), radial-gradient(#FF5964 1.5px, #FFF9E6 1.5px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
    }
  </style>
</head>

    let currentStyleIndex = 0;

    // 初始化导航栏与下拉菜单
    function initApp() {
      const navContainer = document.getElementById('styles-nav-list');
      const selector = document.getElementById('style-selector');

      stylesDatabase.forEach((style, index) => {
        // 侧边栏按钮
        const btn = document.createElement('button');
        btn.id = `nav-btn-${index}`;
        btn.className = `w-full text-left px-3 py-2 rounded-lg text-xs font-mono flex items-center justify-between transition-all ${
          index === 0 ? 'bg-[#1C2230] text-emerald-400 border border-emerald-500/40' : 'text-slate-400 hover:bg-[#1A1E29] hover:text-slate-200'
        }`;
        btn.onclick = () => selectStyle(index);
        btn.innerHTML = `
          <div class="flex items-center space-x-2 truncate">
            <span class="text-[10px] opacity-60">${style.id}</span>
            <span class="truncate font-medium">${style.name.split(' ')[0]}</span>
          </div>
          <span class="text-[9px] px-1.5 py-0.5 rounded bg-black/40 text-slate-500 border border-slate-800">
            ${style.key}
          </span>
        `;
        navContainer.appendChild(btn);

        // 下拉框选项
        const opt = document.createElement('option');
        opt.value = index;
        opt.innerText = `${style.id}. ${style.name}`;
        selector.appendChild(opt);
      });

      renderCurrentStyle();
    }

    // 切换风格
    function selectStyle(index) {
      currentStyleIndex = index;
      document.getElementById('style-selector').value = index;

      // 更新按钮高亮
      document.querySelectorAll('#styles-nav-list button').forEach((btn, i) => {
        if (i === index) {
          btn.className = 'w-full text-left px-3 py-2 rounded-lg text-xs font-mono flex items-center justify-between transition-all bg-[#1C2230] text-emerald-400 border border-emerald-500/40';
        } else {
          btn.className = 'w-full text-left px-3 py-2 rounded-lg text-xs font-mono flex items-center justify-between transition-all text-slate-400 hover:bg-[#1A1E29] hover:text-slate-200';
        }
      });

      renderCurrentStyle();
    }

    function switchStyle(val) {
      selectStyle(parseInt(val, 10));
    }

    // 渲染当前所选风格
    function renderCurrentStyle() {
      const style = stylesDatabase[currentStyleIndex];

      document.getElementById('current-id-badge').innerText = style.id;
      document.getElementById('current-style-name').innerText = style.name;
      document.getElementById('current-style-alias').innerText = `// ${style.alias}`;
      document.getElementById('current-style-desc').innerText = style.desc;

      // 渲染调色板
      const paletteContainer = document.getElementById('palette-swatches');
      paletteContainer.innerHTML = style.palette.map(color => `
        <div class="flex items-center space-x-1 bg-black/50 px-2 py-0.5 rounded border border-slate-800" title="${color}">
          <span class="w-3 h-3 rounded-full border border-white/20 inline-block" style="background-color: ${color}"></span>
          <span class="text-[10px] text-slate-300 font-mono">${color}</span>
        </div>
      `).join('');

      // 渲染沙盒舞台中的具体网页内容
      const stage = document.getElementById('preview-stage-container');
      stage.innerHTML = style.render();
    }

    initApp();
  </script>
